<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDP Leaderboard 2026 — PGA of BC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a1a1a;
    --navy-mid:#2d2d2d;
    --red:#ef3e42;
    --red-dark:#c42d30;
    --cream:#f5f5f5;
    --ink:#1a1a1a;
    --muted:#667;
    --line:#e4e6ec;
    --stripe:#fafafa;
    --gold:#c9a84c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',-apple-system,'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    background:#fff;
    display:flex;flex-direction:column;
  }
  .logobar{
    background:#fff;
    border-bottom:3px solid var(--red);
    padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    flex:0 0 auto;
  }
  .logobar img{height:44px;width:auto;display:block;}
  .logobar .titles{text-align:center;flex:1 1 auto;min-width:220px;}
  .logobar h1{
    font-family:'Playfair Display',serif;
    font-weight:700;font-size:1.45rem;line-height:1.15;color:var(--navy);
  }
  .logobar h1 span{color:var(--red);}
  .logobar .subtitle{font-size:.82rem;color:var(--muted);margin-top:2px;letter-spacing:.03em;}
  .toolbar{
    background:linear-gradient(160deg,#1a1a1a 0%,#2d2d2d 100%);
    padding:10px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    flex:0 0 auto;
    border-bottom:2px solid var(--red);
  }
  .toolbar input[type=search]{
    flex:1 1 220px;
    font:inherit;font-size:.9rem;
    padding:8px 12px;
    border:none;border-radius:6px;
    background:rgba(255,255,255,.95);color:var(--ink);
  }
  .toolbar input[type=search]:focus{outline:2px solid var(--red);outline-offset:1px;}
  .toolbar label.toggle{
    display:flex;align-items:center;gap:6px;
    color:#ddd;font-size:.8rem;cursor:pointer;white-space:nowrap;
  }
  .count{font-size:.8rem;color:#bbb;white-space:nowrap;}
  .updated{font-size:.75rem;color:#999;white-space:nowrap;}
  .refresh-btn{
    background:var(--red);color:#fff;border:none;border-radius:6px;
    padding:8px 14px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  .refresh-btn:hover{background:var(--red-dark);}
  .hashtag{font-weight:600;color:var(--red);font-size:.85rem;letter-spacing:.03em;white-space:nowrap;}
  .table-wrap{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:1600px;}
  thead th{
    position:sticky;z-index:2;
    font-weight:600;font-size:.72rem;
    text-transform:uppercase;letter-spacing:.04em;
    padding:7px 8px;text-align:center;white-space:nowrap;
  }
  thead tr.cats th{top:0;background:var(--navy);color:var(--gold);border-bottom:1px solid #000;}
  thead tr.cols th{top:29px;background:var(--navy-mid);color:#fff;border-bottom:2px solid var(--red);}
  thead tr.cols th.left{text-align:left;}
  thead th.cat-mem{background:#2d3748;color:#fff;}
  thead th.cat-trade{background:#3d4a5c;color:#fff;}
  thead th.cat-pgaed{background:var(--red);color:#fff;}
  thead th.cat-othered{background:#1a4d2e;color:#fff;}
  thead th.cat-vol{background:#2b4c7e;color:#fff;}
  thead th.cat-other{background:#5c3d2e;color:#fff;}
  thead th.cat-total{background:var(--gold);color:var(--navy);}
  tbody td{
    padding:6px 8px;border-bottom:1px solid var(--line);
    text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  tbody td.left{text-align:left;}
  tbody tr:nth-child(even){background:var(--stripe);}
  tbody tr:hover{background:#fdf1f1;}
  td.player{font-weight:600;}
  td.facility{color:var(--muted);}
  td.total{font-weight:700;color:var(--red-dark);background:rgba(201,168,76,.10);}
  td.zero{color:#c3c7cf;}
  .rank-chip{display:inline-block;min-width:2.1em;text-align:center;font-weight:600;color:var(--muted);}
  tr.podium .rank-chip{background:var(--gold);color:#fff;border-radius:999px;padding:1px 6px;font-weight:700;}
  tr.podium td.player{color:var(--red-dark);}
  .status{padding:40px 20px;text-align:center;color:var(--muted);font-size:.9rem;}
  .status.error{color:var(--red-dark);}
  .status a{color:var(--red);}
  @media (max-width:640px){
    .logobar{justify-content:center;}
    .logobar img{height:34px;}
    .logobar h1{font-size:1.15rem;}
  }
</style>
</head>

<script>
/* ============================================================
   SETUP — paste your published-sheet CSV link between the quotes.
   In Google Sheets: File → Share → Publish to web →
   select ONLY the "PDP Leaderboard 2026" tab → choose
   "Comma-separated values (.csv)" → Publish → copy the link.
   ============================================================ */
var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTfuvoDo2IuSuxUhdU-NlHN26xegZZYbaVpWZqb_68Jnq9ofGQeQYqZ5YanOR1JNNHG67rUPB5TWIEL/pub?gid=408613206&single=true&output=csv';

/* Set to true if you want member numbers shown publicly */
var SHOW_MEMBER_NUMBERS = false;

/* Auto-refresh interval in minutes (0 = off) */
var AUTO_REFRESH_MIN = 5;

/* Category bands: label, number of activity columns, css class.
   Matches the column order of the PDP Leaderboard 2026 tab. */
var CATEGORY_BANDS = [
  { label: 'Memberships',              cols: 1, cls: 'cat-mem' },
  { label: 'Trade Shows',              cols: 2, cls: 'cat-trade' },
  { label: 'PGA of BC Education',      cols: 4, cls: 'cat-pgaed' },
  { label: 'Other Industry Education', cols: 6, cls: 'cat-othered' },
  { label: 'PGA of BC Volunteerism',   cols: 6, cls: 'cat-vol' },
  { label: 'Other',                    cols: 3, cls: 'cat-other' }
];

var allRows = [], headers = [];

function parseCSV(text) {
  var rows = [], row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (ch !== '\r') cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return c.trim() !== ''; }); });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function load() {
  var status = document.getElementById('status');
  if (CSV_URL.indexOf('PASTE_YOUR') === 0) {
    status.className = 'status error';
    status.innerHTML = 'Setup needed: open this file and paste your published Google Sheet CSV link into the <b>CSV_URL</b> line near the top of the &lt;script&gt; section.';
    return;
  }
  status.className = 'status';
  status.textContent = 'Loading leaderboard…';
  // cache-buster so refreshes pull fresh data
  fetch(CSV_URL + (CSV_URL.indexOf('?') > -1 ? '&' : '?') + 'cb=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(text){
      var data = parseCSV(text);
      if (data.length < 2) throw new Error('No data rows found');
      headers = data[0];
      allRows = data.slice(1);
      render();
      document.getElementById('updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'});
    })
    .catch(function(err){
      status.className = 'status error';
      status.innerHTML = 'Could not load the leaderboard (' + esc(err.message) + ').<br>' +
        'Check that the sheet tab is published to the web as CSV and the link in CSV_URL is correct.';
      document.getElementById('lb').style.display = 'none';
      status.style.display = 'block';
    });
}

function render() {
  // Column indexes: 0=Mem #, 1=Name, 2=Facility, 3=Total Pts, 4+ = activities
  var startCol = SHOW_MEMBER_NUMBERS ? 0 : 1;
  var totalIdx = 3;

  // sort by total desc, then name
  var rows = allRows.slice().sort(function(a, b){
    var ta = parseFloat(a[totalIdx]) || 0, tb = parseFloat(b[totalIdx]) || 0;
    if (tb !== ta) return tb - ta;
    return String(a[1]).localeCompare(String(b[1]));
  });

  // ranks with ties
  var ranks = [], lastTotal = null, lastRank = 0;
  rows.forEach(function(r, i){
    var t = parseFloat(r[totalIdx]) || 0;
    if (t !== lastTotal) { lastRank = i + 1; lastTotal = t; }
    ranks.push(lastRank);
  });

  // ---- category band row ----
  var catRow = document.getElementById('cat-row');
  var activityCount = headers.length - 4;
  var bandTotal = CATEGORY_BANDS.reduce(function(s,b){ return s + b.cols; }, 0);
  var infoSpan = (SHOW_MEMBER_NUMBERS ? 3 : 2); // name(+mem#) + facility
  var html = '<th></th><th colspan="' + infoSpan + '"></th><th class="cat-total">Total</th>';
  if (activityCount === bandTotal) {
    CATEGORY_BANDS.forEach(function(b){
      html += '<th class="' + b.cls + '" colspan="' + b.cols + '">' + esc(b.label) + '</th>';
    });
  } else {
    html += '<th colspan="' + activityCount + '">Activities</th>';
  }
  catRow.innerHTML = html;

  // ---- column header row ----
  var colRow = document.getElementById('col-row');
  html = '<th>Rank</th>';
  if (SHOW_MEMBER_NUMBERS) html += '<th>Mem #</th>';
  html += '<th class="left">Name</th><th class="left">Facility</th><th>Total Pts</th>';
  for (var c = 4; c < headers.length; c++) html += '<th>' + esc(headers[c]) + '</th>';
  colRow.innerHTML = html;

  // ---- body ----
  var q = document.getElementById('search').value.trim().toLowerCase();
  var hideZero = document.getElementById('hide-zero').checked;
  var body = '', shown = 0;

  rows.forEach(function(r, i){
    var total = parseFloat(r[totalIdx]) || 0;
    if (hideZero && total === 0) return;
    var hay = (r[1] + ' ' + r[2] + (SHOW_MEMBER_NUMBERS ? ' ' + r[0] : '')).toLowerCase();
    if (q && hay.indexOf(q) === -1) return;
    shown++;

    var tr = '<tr class="' + (ranks[i] <= 3 && total > 0 ? 'podium' : '') + '">';
    tr += '<td><span class="rank-chip">' + ranks[i] + '</span></td>';
    if (SHOW_MEMBER_NUMBERS) tr += '<td>' + esc(r[0]) + '</td>';
    tr += '<td class="left player">' + esc(r[1]) + '</td>';
    tr += '<td class="left facility">' + (esc(r[2]) || '—') + '</td>';
    tr += '<td class="total">' + total + '</td>';
    for (var c = 4; c < headers.length; c++) {
      var v = parseFloat(r[c]) || 0;
      tr += '<td class="' + (v === 0 ? 'zero' : '') + '">' + v + '</td>';
    }
    tr += '</tr>';
    body += tr;
  });

  document.getElementById('tbody').innerHTML = body;
  document.getElementById('count').textContent =
    shown === rows.length ? rows.length + ' members' : shown + ' of ' + rows.length + ' members';
  document.getElementById('status').style.display = shown ? 'none' : 'block';
  document.getElementById('status').className = 'status';
  document.getElementById('status').textContent = shown ? '' : 'No members match that search.';
  document.getElementById('lb').style.display = '';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('hide-zero').addEventListener('change', render);
document.getElementById('refresh').addEventListener('click', load);
if (AUTO_REFRESH_MIN > 0) setInterval(load, AUTO_REFRESH_MIN * 60 * 1000);
load();
</script>
</body>
</html>
